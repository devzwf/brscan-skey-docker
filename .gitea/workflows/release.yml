name: Release

on:
  push:
    tags: ['v*']
  # Weekly rebuild of the latest release (Debian security updates)
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish (e.g. v1.0.0). Empty = latest tag"
        required: false

jobs:
  publish:
    name: Build & push to Docker Hub
    runs-on: ubuntu-latest
    env:
      IMAGE: devzwf/brscan-skey
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          LATEST=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ "$EVENT" = push ]; then TAG=${GITHUB_REF#refs/tags/}
          else TAG=$(echo "${INPUT_TAG:-$LATEST}" | tr -d '[:space:]'); case "$TAG" in v*) ;; *) TAG="v$TAG";; esac
          fi
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' || ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "❌ '$TAG' is not an existing vX.Y.Z tag"; git tag -l 'v*' | sort -V | tail -5; exit 1
          fi
          git checkout -q "$TAG"
          VERSION=${TAG#v}
          [ "$(cat VERSION)" = "$VERSION" ] || { echo "❌ tag $TAG ≠ VERSION file ($(cat VERSION))"; exit 1; }
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "minor=${VERSION%.*}" >> $GITHUB_OUTPUT
          echo "is_latest=$([ "$TAG" = "$LATEST" ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "Tag: $TAG (latest: $LATEST)"

      - name: Tags
        id: tags
        run: |
          T="$IMAGE:${{ steps.tag.outputs.version }},$IMAGE:${{ steps.tag.outputs.minor }}"
          [ "${{ steps.tag.outputs.is_latest }}" = true ] && T="$T,$IMAGE:latest"
          echo "list=$T" >> $GITHUB_OUTPUT
          echo "$T"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Brother only ships x86 drivers: amd64 only
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: VERSION=${{ steps.tag.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.tag.outputs.version }}"

      - name: Gitea release
        if: github.event_name == 'push'
        env:
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          NOTES=$(awk -v v="$VERSION" 'index($0,"## [" v "]")==1{f=1;next} f&&index($0,"## [")==1{exit} f{print}' CHANGELOG.md)
          BODY=$(printf '%s\n\n```\ndocker pull %s:%s\n```\n' "$NOTES" "$IMAGE" "$VERSION")
          jq -n --arg t "$TAG" --arg b "$BODY" '{tag_name:$t,name:$t,body:$b,draft:false,prerelease:false}' \
            | curl -fsS -X POST -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' "$API/releases" -d @- >/dev/null
          echo "Release $TAG created"
